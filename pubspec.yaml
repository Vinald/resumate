name: resumate
description: "Resumate — generate resumes, cover letters and application letters on your phone, export to PDF, DOCX, text and LaTeX, and combine PDFs."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State
  provider: ^6.1.2

  # PDF generation + preview + print/share
  pdf: ^3.11.1
  printing: ^5.13.3

  # PDF merge (native Android + iOS)
  pdf_combiner: ^3.1.0

  # Files, sharing, storage
  file_picker: ^8.1.4
  share_plus: ^10.1.2
  path_provider: ^2.1.5

  # DOCX (zip of XML)
  archive: ^3.6.1

  # Signature image + accent colour
  image_picker: ^1.1.2
  flutter_colorpicker: ^1.1.0
  # Re-encodes whatever the gallery returns (HEIC/WebP/etc.) to a real PNG —
  # was already a transitive dependency of image_picker; made explicit
  # because SignaturePicker now imports it directly.
  image: ^4.3.0

  # Misc
  uuid: ^4.5.1
  intl: ^0.19.0
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# pdf_combiner 3.4.0 imports file_magic_number/file_magic_number_type.dart,
# which was moved out of the package root in file_magic_number 1.3.0. Pin to the
# last version that still exposes it.
dependency_overrides:
  file_magic_number: 1.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/templates/
  fonts:
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond-Regular.ttf
        - asset: assets/fonts/EBGaramond-Bold.ttf
          weight: 700
        - asset: assets/fonts/EBGaramond-Italic.ttf
          style: italic
        - asset: assets/fonts/EBGaramond-BoldItalic.ttf
          weight: 700
          style: italic
    - family: FontAwesome
      fonts:
        - asset: assets/fonts/FontAwesome-Solid.ttf
        - asset: assets/fonts/FontAwesome-Brands.ttf
